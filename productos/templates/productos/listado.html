<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Productos - Tienda</title>
</head>
<body>
    <h1>Listado de Productos</h1>

    <a href="{% url 'registrar_producto' %}">Registrar producto</a>
    <br><br>

    {% if productos %}
        <table border="1" cellpadding="8">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                </tr>
            </thead>
            <tbody>
                {% for p in productos %}
                    <tr>
                        <td>{{ p.nombre }}</td>
                        <td>{{ p.categoria }}</td>
                        <td>${{ p.precio }}</td>
                        <td>{{ p.cantidad }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>Todavía no hay productos registrados.</p>
    {% endif %}
</body>
</html>
