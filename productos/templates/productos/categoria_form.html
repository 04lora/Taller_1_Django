<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Categoría</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        h2 {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-submit {
            flex: 1;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        .btn-cancel {
            flex: 1;
            text-align: center;
            background-color: #ffffff;
            color: #475569;
            border: 1px solid #cbd5e1;
            padding: 9px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            box-sizing: border-box;
        }

        .btn-cancel:hover {
            background-color: #f1f5f9;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Editar Categoría</h2>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Nombre de Categoría</label>
                <input type="text" name="nombre" value="{{ categoria.nombre }}" required>
            </div>
            <div class="form-group">
                <label>Descripción</label>
                <textarea name="descripcion">{{ categoria.descripcion }}</textarea>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn-submit">Actualizar</button>
                <a href="{% url 'listar_categorias' %}" class="btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>

</body>

</html>
