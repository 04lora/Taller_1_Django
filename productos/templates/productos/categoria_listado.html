<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Categorías</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .top-bar h1 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
        }

        .back-link {
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        .back-link:hover {
            color: #2563eb;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .card h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #0f172a;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        textarea {
            resize: vertical;
            height: 70px;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        .btn-submit {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        .table-card {
            background-color: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f1f5f9;
            color: #475569;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 12px 18px;
            border-bottom: 1px solid #e2e8f0;
        }

        td {
            padding: 12px 18px;
            font-size: 14px;
            border-bottom: 1px solid #f1f5f9;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .action-link {
            color: #2563eb;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin-right: 12px;
        }

        .action-link:hover {
            text-decoration: underline;
        }

        .action-delete {
            color: #ef4444;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="top-bar">
            <h1>Categorías</h1>
            <a href="{% url 'listar_productos' %}" class="back-link">← Volver a productos</a>
        </div>

        <div class="card">
            <h2>Agregar nueva categoría</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" name="nombre" placeholder="Nombre de la categoría" required>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea name="descripcion" placeholder="Descripción opcional..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Guardar Categoría</button>
            </form>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Categoría</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for cat in categorias %}
                    <tr>
                        <td style="color: #64748b;">#{{ cat.id }}</td>
                        <td style="font-weight: 600; color: #0f172a;">{{ cat.nombre }}</td>
                        <td style="color: #64748b;">{{ cat.descripcion|default:"-" }}</td>
                        <td>
                            <a href="{% url 'editar_categoria' cat.id %}" class="action-link">Editar</a>
                            <a href="{% url 'eliminar_categoria' cat.id %}" class="action-link action-delete" onclick="return confirm('¿Eliminar esta categoría?');">Eliminar</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" style="text-align: center; color: #94a3b8; padding: 24px;">No hay categorías creadas.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</body>

</html>
